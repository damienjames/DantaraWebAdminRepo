<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dantara Admin - Landing (archived)</title>
  <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/assets/fonts/google-fonts/combined.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background:#f6fafb; }
    .admin-landing { max-width: 980px; margin: 48px auto; padding: 24px; }
    .card { border-radius: 12px; box-shadow: 0 8px 24px rgba(13,38,46,0.06); border: 1px solid rgba(13,38,46,0.04); background: #fff; }
    .card-body { padding: 24px; }
    .hero { text-align: center; padding: 24px 12px; }
    .hero h1 { margin-bottom: 6px; font-size: 22px; }
    .hero p { color: #5f6b6e; margin-bottom: 18px; }
    .admin-actions { display:flex; gap:16px; align-items:stretch; }
    .admin-action { flex:1; padding: 18px; border-radius: 10px; background: linear-gradient(180deg,#fff,#fbfdff); display:flex; flex-direction:column; gap:12px; }
    .admin-action h3 { margin:0; font-size:16px; }
    .admin-action p { margin:0; color:#6b7174; font-size:14px; }
    .admin-action .btn { margin-top: 8px; align-self:flex-start; }
  </style>
</head>
<body>
  <div class="admin-landing">
    <div class="hero">
      <h1>Admin Tools</h1>
      <p>Manage site data and utilities from a single admin workspace. Choose a tool below to get started.</p>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="admin-actions">
          <div class="admin-action">
            <h3>Edit Special Offers</h3>
            <p>Open the Special Offers editor (promo-admin) to create, edit, preview and publish promotions.</p>
            <a class="btn btn-primary" href="/admin/index.html" role="button">Open Editor</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
