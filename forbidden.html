<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Access Denied | Dantara Admin</title>
  <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: #f8fafc; }
    .card { border: 1px solid rgba(0,0,0,.06); box-shadow: 0 10px 20px rgba(0,0,0,.06); border-radius: 16px; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4 p-md-5">
          <h1 class="h3 mb-2">403: Access denied</h1>
          <p class="text-muted">You are signed in, but you don't have permission to view this page.</p>
          <div class="d-flex gap-2 mt-3">
            <a class="btn btn-primary" href="/.auth/login/aad?post_login_redirect_uri=/admin/">Sign in with a different account</a>
            <a class="btn btn-outline-secondary" href="/">Go to homepage</a>
          </div>
          <hr class="my-4" />
          <div class="small text-muted">If you believe this is an error, contact the site administrator to request access.</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
